# Publishes server.json (the hosted Immaculate MCP endpoint) to the Official MCP Registry when a v* tag is pushed,
# authenticated with this repository's GitHub OIDC identity (namespace io.github.Arobi-Technology-Alliance-Lab).
# mcp-publisher is pinned and its Sigstore bundle verified before use, as the registry's own guide shows.
name: Publish to the MCP Registry
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: The tag matches server.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          want="${GITHUB_REF#refs/tags/v}"
          have="$(jq -r .version server.json)"
          [ "$want" = "$have" ] || { echo "tag v$want but server.json says $have"; exit 1; }
      - name: The hosted endpoint reports server.json's version
        # server.json describes the hosted endpoint, so the registry lists only a version it serves (its serverInfo).
        run: |
          set -euo pipefail
          want="$(jq -r .version server.json)"
          url="$(jq -r '.remotes[0].url' server.json)"
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"registry-publish-check","version":"1.0.0"}}}'
          have="$(curl --fail --silent --show-error --max-time 30 -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' -d "$body" "$url" | jq -r '.result.serverInfo.version')"
          [ "$want" = "$have" ] || { echo "server.json says $want but $url reports $have; publish only what it serves"; exit 1; }
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
